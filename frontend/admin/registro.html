<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Menú Digital</title>
    <link rel="stylesheet" href="/admin/registro.css" />
    <link rel="stylesheet" href="/features.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
 
  <body>
    <form class="form-registro" id="formRegistro">
        
        <div class="registro-header">
            <span class="registro-emoji"></span>
            <h1 class="registro-title">Creá tu cuenta</h1>
            <!--<p class="login-subtitle">Creá tu cuenta</p> -->
        </div>

        <div class="registro-field">
            <label>Teléfono</label>
            <div class="telefono-wrapper">
                <span id="flagPais" class="flag-phone">🇦🇷</span>
                <select id="codigoPais" name="codigoPais" class="codigo-pais">
                    <option value="+54" selected>🇦🇷 +54</option>
                    <option value="+56">🇨🇱 +56</option>
                    <option value="+57">🇨🇴 +57</option>
                    <option value="+58">🇻🇪 +58</option>
                    <option value="+51">🇵🇪 +51</option>
                    <option value="+52">🇲🇽 +52</option>
                    <option value="+55">🇧🇷 +55</option>
                    <option value="+593">🇪🇨 +593</option>
                    <option value="+591">🇧🇴 +591</option>
                    <option value="+595">🇵🇾 +595</option>
                    <option value="+598">🇺🇾 +598</option>
                    <option value="+507">🇵🇦 +507</option>
                    <option value="+506">🇨🇷 +506</option>
                    <option value="+503">🇸🇻 +503</option>
                    <option value="+502">🇬🇹 +502</option>
                    <option value="+504">🇭🇳 +504</option>
                    <option value="+505">🇳🇮 +505</option>
                    <option value="+53">🇨🇺 +53</option>
                    <option value="+1809">🇩🇴 +1809</option>
                </select>
                <input type="text" id="Telefono" name="telefono" placeholder="Ej: 11 2345 6789" required />
            </div>
            <span class="error-text" id="errorTelefono"></span>
        </div>
        
        <div class="registro-field">
            <label>Nombre de Usuario</label>
            <input type="text" id="nombreDeUsuario" name="nombreDeUsuario" placeholder="Usuario" required />

        </div>

         <div class="registro-field">
            <label>Nombre del Local</label>
            <input type="text" id="nombreDelLocal" name="nombreDelLocal" placeholder="Nombre del local" required />

        </div>

        <div class="registro-field">
            <label>Email</label>
            <input type="text" id="Email" name="email" placeholder="Email" required />
            <span class="error-text" id="errorEmail"></span>
        </div>

        <div class="registro-field">
            <label>Contraseña</label>
            <input type="password" id="Contraseña" name="contraseña" placeholder="Contraseña" required />
        </div>

        <div class="registro-field">
            <label>Confirmar Contraseña</label>
            <input type="password" id="ConfirmarContraseña" name="confirmarContraseña" placeholder="Repetir contraseña" required />
            <span class="error-text" id="errorConfirmar"></span>
        </div>

        <p class="registro-error" id="registroError"></p>

        <button type="submit">Registrarse</button>
        <div class="registro-field" id="registroField">
            <p><a href="/admin/login.html" class="link-log-reg">ya estoy registrado</a></p>
        </div>


    </form>
    <script src="/api.js"></script>
    <script src="/admin/registro.js"></script>
  </body>
